<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>온라인 QR 퀴즈 서바이벌 - 관리자</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">🏆</div>
      <div>
        <h1>온라인 QR 퀴즈 서바이벌</h1>
        <p>맞추면 다음 문제, 틀리면 탈락!</p>
      </div>
    </div>
    <div class="badge waiting" id="statusBadge">
      <span class="dot"></span><span id="statusText">대기 중</span>
    </div>
  </header>

  <div class="container">
    <div class="grid">
      <!-- 좌측: QR + 설정 + 컨트롤 -->
      <div class="col">
        <div class="card">
          <h2><span class="ico">📱</span> 참가 QR 코드</h2>
          <div class="qr-box">
            <img id="qrImage" src="" alt="QR 코드" />
            <div class="qr-url">
              <input id="qrUrl" type="text" readonly />
              <button id="copyBtn">복사</button>
            </div>
            <button class="btn btn-primary" id="fullscreenQrBtn">🔍 QR 전체 화면</button>
          </div>
          <div class="qr-hint">휴대폰으로 QR을 스캔하면 참가 화면이 열립니다</div>
        </div>
        <a class="btn btn-primary" href="control.html" style="text-decoration:none;">🎮 관리자 컨트롤 열기</a>

        <div class="card">
          <h2><span class="ico">⚙️</span> 게임 설정</h2>
          <div class="setting-row">
            <div>
              <div class="label">🏁 종료 기준 인원</div>
              <div class="sub">이 인원만큼 남으면 게임이 종료됩니다</div>
            </div>
            <div class="num-input">
              <button id="targetMinus">−</button>
              <input id="targetInput" type="number" min="1" value="5" />
              <button id="targetPlus">＋</button>
            </div>
          </div>
          <div class="setting-row">
            <div>
              <div class="label">🔀 문제 무작위 출제</div>
              <div class="sub">문제를 섞어서 랜덤 순서로 출제합니다</div>
            </div>
            <label class="switch">
              <input type="checkbox" id="shuffleToggle" checked />
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <div class="card">
          <h2><span class="ico">🎮</span> 게임 컨트롤</h2>
          <div class="btn-row">
            <button class="btn btn-success" id="startBtn">🚀 게임 시작</button>
            <button class="btn btn-primary" id="nextBtn" disabled>다음 문제 ➡️</button>
          </div>
          <div class="btn-row" style="margin-top:10px">
            <button class="btn btn-ghost" id="resetBtn">🔄 초기화</button>
            <button class="btn btn-danger" id="finishBtn" disabled>🏁 즉시 종료</button>
          </div>
        </div>
      </div>

      <!-- 우측: 통계 + 명단 + 문제 관리 -->
      <div class="col">
        <div class="stats">
          <div class="stat c-cyan">
            <div class="num" id="statPlayers">0</div>
            <div class="cap">📶 접속자 수</div>
          </div>
          <div class="stat c-accent">
            <div class="num" id="statQuestion">0</div>
            <div class="cap">📝 현재 문제</div>
          </div>
          <div class="stat c-purple">
            <div class="num" id="statCorrect">0</div>
            <div class="cap">✅ 정답자 수</div>
          </div>
          <div class="stat c-red">
            <div class="num" id="statEliminated">0</div>
            <div class="cap">❌ 탈락 인원</div>
          </div>
          <div class="stat c-green">
            <div class="num" id="statAlive">0</div>
            <div class="cap">✅ 남은 인원</div>
          </div>
        </div>

        <div class="card">
          <h2><span class="ico">👥</span> 남은 인원 명단 <button class="refresh-btn" id="refreshNamesBtn">🔄 새로고침</button></h2>
          <div class="chips" id="aliveChips"></div>
          <div class="empty" id="aliveEmpty">아직 참가자가 없습니다</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 전체 화면 QR -->
  <div id="fullscreenQr" hidden>
    <div class="fs-qr-box">
      <img id="fullscreenQrImage" alt="QR 코드" />
      <p id="fullscreenQrUrl"></p>
    </div>
    <button class="btn btn-ghost fs-back" id="fullscreenBackBtn">⬅️ 돌아가기</button>
  </div>

  <!-- QR (외부 라이브러리 불필요) -->
  <script src="qr.js"></script>
  <script type="module" src="projector.js"></script>
</body>
</html>
